[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retrieval-eval-lab"
version = "0.1.0"
description = "retrieval-eval-lab: a reproducible Python portfolio project"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
retrieval-eval = "retrieval_eval:main"

[tool.setuptools]
py-modules = ["retrieval_eval"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
